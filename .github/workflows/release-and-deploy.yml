on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

name: "release and deploy"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
    outputs:
      apps/editor--release_created: ${{ steps.release.outputs['apps/editor--release_created'] }}

  build:
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ needs.release.outputs['apps/editor--release_created'] }}
    env:
      VITE_BASE_URL: "/"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Build
        run: pnpm build
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: apps/editor/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: apps/editor/dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor/dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
