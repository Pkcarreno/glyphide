version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      include: scope
      prefix-development: chore
    versioning-strategy: increase
    groups:
      all:
        patterns:
          - "*"
    cooldown:
      default-days: 1
    # TODO(TS 7.1): Desbloquear tsdown cuando TypeScript 7.1 este disponible de forma estable
    # tsdown 0.23.2 depende de rolldown-plugin-dts 0.29 (beta) que requiere typescript/async (TS 7.1+)
    ignore:
      - dependency-name: "tsdown"
        versions: ["0.23.2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "actions/*"
