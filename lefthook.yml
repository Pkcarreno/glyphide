pre-commit:
  jobs:
    - run: pnpm lint:fix {staged_files}
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,astro}"
      stage_fixed: true
    - run: pnpm typecheck
      glob: "*.{js,jsx,ts,tsx,astro}"
    - run: pnpm check
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,astro}"
    - run: pnpm test
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,astro}"

pre-push:
  jobs:
    - run: pnpm lint {push_files}
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,astro}"
    - run: pnpm test

post-merge:
  jobs:
    - run: pnpm install
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "pnpm-lock.yaml"

commit-msg:
  jobs:
    - run: pnpm commitlint --edit {1}
