<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyphide · QuickJS Demo</title>
    <meta
      name="description"
      content="Minimal demo for testing QuickJS engine execution via the Glyphide orchestrator."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">
          <h1>Glyphide <span class="logo-accent">Demo</span></h1>
        </div>
        <div class="status" id="engine-status">
          <span class="status-dot"></span>
          <span class="status-text">Idle</span>
        </div>
      </header>

      <main class="workspace">
        <section class="editor-section">
          <label for="code-input" class="section-label"> Code </label>
          <textarea
            id="code-input"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="// Write JavaScript here..."
          ></textarea>
        </section>

        <div class="controls">
          <button id="run-btn" type="button">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <title>Run</title>
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            Run
          </button>
          <button id="interrupt-btn" type="button" disabled>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <title>Interrupt</title>
              <rect x="6" y="6" width="12" height="12" rx="1"></rect>
            </svg>
            Interrupt
          </button>
          <button id="clear-btn" type="button" class="btn-ghost">
            Clear Output
          </button>
        </div>

        <section class="output-section">
          <label class="section-label">Output</label>
          <div id="output-panel" class="output-panel">
            <div class="output-placeholder">
              Output will appear here after execution.
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
